<title>PromptFox</title>
<style>
  :root { --ink:#1c1c2e; --dim:#6e6e85; --teal:#30B0C7; --bg:#f8f6f4; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8e8f2; --dim:#9a9ab0; --bg:#14101a; }
  }
  body { font: 17px/1.7 -apple-system, "Segoe UI", sans-serif; color: var(--ink);
         background: var(--bg); display: grid; place-items: center; min-height: 100vh; margin: 0; }
  main { text-align: center; padding: 24px; }
  .mark { font-size: 64px; }
  h1 { margin: 8px 0 4px; }
  p { color: var(--dim); margin: 0 0 20px; }
  a { color: var(--teal); font-weight: 600; margin: 0 10px; }
</style>
</head>
<body>
<main>
  <div class="mark">🦊</div>
  <h1>PromptFox</h1>
  <p>The AI prompt keyboard — local-first and private.</p>
